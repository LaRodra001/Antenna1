<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Antenna 1</title>
</head>

<body>
    <h2>Antenna 1</h2>
    <div class="antenna">
        <div class="antennaCircle">
            <div class="antenaDot"></div>
        </div>
    </div>
    <div class="info">
        <div class="StatusContainer">
            <h3>Status: <span id="StatusText">OFFLINE</span></h3>
            <label class="Switch">
                <input type="checkbox" id="StatusSwitch">
                <span class="Slider"></span>
            </label>
        </div>
        <h3>Requests:</h3>
    </div>

    <script src="script.js"></script>
</body>

</html>
